# MP113 findings --- fill in every value, keep every key.
# The marking tool reads this file. Write null only where the comment says so.
# Use the exact column names and group values from your data files.

group_id: "G173"          # your group id, e.g. "G042"
problem_id: "MP113"


data_issues:
  leaking_column:
    present: true
    column: litres_per_day

  unit_mixup:
    present: true
    column: highway_distance_km
    group_value: Industrial
    factor: 1000

  sentinel_value:
    present: false
    column: null
    value: null
    count: null

  duplicate_rows:
    present: true
    count: 60

  stuck_sensor:
    present: true
    column: temp_c
    start_date: "2026-02-08"
    end_date: "2026-02-22"

  target_typos:
    present: false
    count: null

  spelling_variants:
    present: true
    column: ownership
    true_levels: 3
      # how many real categories there are after cleaning

tracking:
  experiment_name: null
  best_run_id: null        # the MLflow run id of your v1 model
  registered_model_name: null
  champion_version: null

monitoring:
  psi:                     # cleaned train.csv vs later.csv, 10 bins
    highway_distance_km: null
    nearby_pumps: null
    price_rs: null
    trucks_passing: null
    temp_c: null
    staff: null
  most_drifted_feature: null
  mae_by_group:            # v1 on later.csv, per value of zone
    'Highway': null
    'City': null
    'Industrial': null
  worst_served_group: null
  mae_v1_on_check: null    # v1 on the last 30% of later.csv (by date)
  mae_v2_on_check: null    # v2 on the same rows
  decision: null           # promote or keep
