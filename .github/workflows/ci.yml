on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

name: Continuous Integration

jobs:
  test:
    name: Run Pytest Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12 with Dependency Caching
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Model Artifact Presence
        run: |
          python -c "import os; assert os.path.exists('models/model.joblib'), 'Champion model artifact missing!'"

      - name: Run Automated Pytest Suite
        run: |
          pytest -v -W ignore --tb=short
