apiVersion: apps/v1
kind: Deployment
metadata:
  name: mp113-api
  labels:
    app: mp113-api
spec:
  replicas: 4
  selector:
    matchLabels:
      app: mp113-api
  template:
    metadata:
      labels:
        app: mp113-api
    spec:
      containers:
      - name: mp113-api
        image: mp113-api:1.0
        ports:
        - containerPort: 8000
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 20
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
